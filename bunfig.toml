[test]
# Per-file ratchet for `npm run test:unit` (only enforced with --coverage).
# Set just below the lowest file (config.ts: ~88.5% lines in the portable suite;
# completions.ts: ~95.7% functions). The symlink test lives in test:posix.
# Raise these when coverage improves; never lower them to make a change pass.
coverageThreshold = { lines = 0.88, functions = 0.95 }
