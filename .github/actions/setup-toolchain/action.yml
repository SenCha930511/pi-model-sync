name: Setup toolchain
description: Install the pinned Node.js (.node-version), Bun (.bun-version), npm, and CI tools.

inputs:
  npm-cache:
    description: Restore and save the npm cache. Release workflows disable it to avoid cache poisoning.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.npm-cache == 'true' && 'npm' || '' }}
        cache-dependency-path: .github/omp-tools/package-lock.json
        package-manager-cache: ${{ inputs.npm-cache == 'true' }}

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Set up npm
      id: npm
      uses: ./.github/actions/setup-npm

    - name: Install CI tools
      shell: bash
      # Only fixed tool directories are appended; no untrusted input reaches GITHUB_PATH.
      run: | # zizmor: ignore[github-env]
        npm ci --prefix "$GITHUB_WORKSPACE/.github/omp-tools" --no-audit --no-fund
        omp_bin="$GITHUB_WORKSPACE/.github/omp-tools/node_modules/.bin"
        if [ "$RUNNER_OS" = "Windows" ]; then
          global_bin=$(npm prefix -g)
        else
          global_bin="$(npm prefix -g)/bin"
        fi
        printf '\n%s\n%s\n' "$global_bin" "$omp_bin" >> "$GITHUB_PATH"

    - name: Verify tool versions
      shell: bash
      env:
        EXPECTED_NPM: ${{ steps.npm.outputs.version }}
      run: |
        expected_omp=$(node -p 'require("./.github/omp-tools/package.json").dependencies["@oh-my-pi/pi-coding-agent"]')
        expected_tsc=$(node -p 'require("./.github/omp-tools/package.json").dependencies["typescript"]')
        expected_pi=$(node -p 'require("./.github/omp-tools/package.json").dependencies["@earendil-works/pi-coding-agent"]')
        expected_bun_types=$(node -p 'require("./.github/omp-tools/package.json").dependencies["@types/bun"]')
        expected_node=$(tr -d '[:space:]' < .node-version)
        expected_bun=$(tr -d '[:space:]' < .bun-version)
        printf '%s\n' "node $(node --version)" "npm $(npm --version)" "bun $(bun --version)" "$(omp --version)" "pi $(pi --version)" "tsc $(tsc --version)"
        test "$(node --version)" = "v$expected_node"
        test "$(npm --version)" = "$EXPECTED_NPM"
        test "$(bun --version)" = "$expected_bun"
        if [ "$expected_bun_types" != "$expected_bun" ]; then
          echo "::error::@types/bun ($expected_bun_types) must match .bun-version ($expected_bun)." >&2
          exit 1
        fi
        test "$(omp --version)" = "omp/$expected_omp"
        test "$(pi --version)" = "$expected_pi"
        test "$(tsc --version)" = "Version $expected_tsc"
