version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /.github/omp-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      omp-tools:
        patterns:
          - "*"
    ignore:
      # @types/bun must match .bun-version; bump both together by hand.
      - dependency-name: "@types/bun"
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
